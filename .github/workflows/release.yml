name: Build

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    outputs:
      native: ${{ steps.changes.outputs.native }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out a merge commit; its first parent is the base branch.
          fetch-depth: 2
      # A pull request bundles only when it touches the Rust app, the npm packages or CI, the
      # parts that can build differently per OS. Pushes, tags and manual runs always bundle.
      - name: Platform-specific changes
        id: changes
        if: github.event_name == 'pull_request'
        run: |
          if git diff --name-only HEAD^1 HEAD | grep -qE '^(src-tauri/|package(-lock)?\.json$|\.github/)'; then
            echo "native=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The typecheck plus the production frontend build, so PRs that skip bundling still build it.
      - run: npm run build
      - run: node scripts/contrast.mjs
      - run: cargo test --manifest-path src-tauri/Cargo.toml

  bundle:
    needs: test
    if: github.event_name != 'pull_request' || needs.test.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            args: ""
          - platform: macos-latest
            args: "--target universal-apple-darwin"
          - platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Linux build dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The tag's CHANGELOG.md section becomes the release notes, and tauri-action copies it
      # into latest.json, where the app reads it. Fails if the section is missing or the tag
      # doesn't match the app version.
      - name: Release notes from CHANGELOG.md
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
        run: |
          {
            echo 'body<<CHANGELOG_EOF'
            node scripts/changelog-section.mjs "$TAG"
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"
      # On tags this creates a draft GitHub release with the installers, the updater bundles,
      # their .sig files and latest.json attached; otherwise the bundles are uploaded as workflow
      # artifacts. Pull requests don't get the signing key, so they skip the updater bundles.
      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }} ${{ github.event_name == 'pull_request' && '--config src-tauri/tauri.no-updater.conf.json' || '' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/') && format('Skillshelf {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          updaterJsonPreferNsis: true
      - uses: actions/upload-artifact@v7
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: skillshelf-${{ matrix.platform }}
          path: |
            src-tauri/target/**/release/bundle/**/*.msi
            src-tauri/target/**/release/bundle/**/*.exe
            src-tauri/target/**/release/bundle/**/*.dmg
            src-tauri/target/**/release/bundle/**/*.AppImage
            src-tauri/target/**/release/bundle/**/*.deb
            src-tauri/target/**/release/bundle/**/*.rpm
          if-no-files-found: ignore
